spring.application.name=Biblioteca-Digital-G4

#Perfil activo: dev | test | prod
spring.profiles.active=dev

# Caché en memoria RAM (proveedor simple basado en mapas de Java)
spring.cache.type=simple

# Swagger UI y OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.displayRequestDuration=true

# Ejecutar data.sql al iniciar la aplicación
spring.sql.init.mode=always

# Ejecutar data.sql después de crear las tablas con Hibernate
spring.jpa.defer-datasource-initialization=true
